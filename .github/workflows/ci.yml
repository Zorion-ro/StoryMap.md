name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The job id and the matrix value produce the check names branch protection
  # requires: `CI / test (20)` and `CI / test (22)`. Do not add a `name:` here —
  # it would override those and silently make the required checks unreportable.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version, and the current LTS above it.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the package contents
        run: npm pack --dry-run
